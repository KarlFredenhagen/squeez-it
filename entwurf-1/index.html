<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stressball gestalten</title>
<style>
:root {
  --bg: #fff; --card: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
  --fill: #e8e8ed; --accent: #0071e3; --err: #d70015; --glass: rgba(255,255,255,.72);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 100%/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

.bar { position: sticky; top: 0; z-index: 10; text-align: center; padding: .8rem 1rem; font-weight: 600; letter-spacing: -.01em;
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }

main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 9rem; display: grid; gap: 1rem; }
.intro { grid-column: 1 / -1; margin-bottom: .5rem; }
h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.04; letter-spacing: -.03em; }
.intro p { margin: .6rem 0 0; color: var(--muted); font-size: 1.2rem; line-height: 1.35; letter-spacing: -.01em; }

.stage { background: var(--card); border-radius: 28px; padding: 2rem 1rem 1.5rem; display: grid; place-items: center; gap: .25rem; }
.stage .ball { width: min(70vw, 360px); aspect-ratio: 1; }
.ball svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 18px 22px rgba(0,0,0,.18)); }
.stage .cap { color: var(--muted); font-size: .95rem; }
@media (min-width: 880px) {
  main { grid-template-columns: 1.1fr 1fr; align-items: start; }
  .stage { position: sticky; top: 4.5rem; min-height: 72vh; }
}

.panel { display: grid; gap: 1rem; }
section { background: var(--card); border-radius: 20px; padding: 1.25rem; }
h2 { margin: 0 0 .85rem; font-size: 1.1rem; letter-spacing: -.015em; }
h2 small { margin-left: .35rem; font-weight: 400; color: var(--muted); font-size: .95rem; }

.opts { display: flex; flex-wrap: wrap; gap: .6rem; }
.opt { position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.opt input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.opt span { display: grid; place-items: center; transition: transform 100ms ease-out, box-shadow 150ms, background 150ms; }
.opt:active span { transform: scale(.95); }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.shapes .opt span { width: 84px; padding: .6rem .4rem .5rem; gap: .15rem; border-radius: 16px; background: var(--fill); font-size: .85rem; }
.shapes .opt svg { width: 44px; height: 44px; }
.shapes input:checked + span { background: var(--card); box-shadow: inset 0 0 0 2px var(--accent); }

.colors .opt span { border-radius: 50%; padding: 3px; }
.colors i { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
.colors input:checked + span { box-shadow: 0 0 0 2px var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--fill); border-radius: 12px; }
.seg .opt span { padding: .5rem .25rem; border-radius: 9px; font-weight: 600; line-height: 1.25; }
.seg small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
.seg input:checked + span { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.14); }

.field { display: grid; gap: .3rem; }
.field + .field { margin-top: .9rem; }
.field label { font-size: .9rem; font-weight: 500; }
.row { display: flex; justify-content: space-between; align-items: baseline; }
.hint { color: var(--muted); font-size: .85rem; }
.err { color: var(--err); font-size: .85rem; }
.err:empty { display: none; }
input:not([type=radio]) { width: 100%; font: inherit; font-size: 1.0625rem; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: .75rem .9rem; outline: none; transition: border-color 150ms, box-shadow 150ms; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
input[aria-invalid=true] { border-color: var(--err); }

.stepper { display: flex; align-items: center; gap: .6rem; }
.stepper input { width: 5rem; text-align: center; }
.round { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: var(--fill); color: var(--text);
  font-size: 1.4rem; cursor: pointer; transition: transform 100ms ease-out; }
.round:active { transform: scale(.92); }

.dock { position: fixed; inset: auto 0 0; z-index: 10; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
.dock div { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
.dock p { flex: 1; margin: 0; font-size: .95rem; color: var(--muted); line-height: 1.3; }
.dock strong { display: block; color: var(--text); }
.btn { border: 0; border-radius: 980px; padding: .8rem 1.6rem; background: var(--accent); color: #fff; font: inherit;
  font-size: 1.0625rem; font-weight: 600; cursor: pointer; transition: transform 100ms ease-out, filter 150ms; }
.btn:active { transform: scale(.97); filter: brightness(.9); }
.btn:focus-visible, .round:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

dialog { width: min(92vw, 420px); border: 0; border-radius: 24px; padding: 1.5rem; background: var(--card); color: var(--text); text-align: center; }
dialog::backdrop { background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
dialog[open] { animation: pop 320ms cubic-bezier(.2,.9,.3,1); }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
dialog .ball { width: 140px; aspect-ratio: 1; margin: 0 auto; }
dialog h2 { font-size: 1.6rem; letter-spacing: -.02em; margin: .5rem 0 .25rem; }
dialog .note { color: var(--muted); font-size: .85rem; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem; text-align: left; margin: 1.25rem 0; }
.summary dt { color: var(--muted); }
.summary dd { margin: 0; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
@media (prefers-reduced-transparency: reduce) { .bar, .dock { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; } }
</style>
</head>
<body>
<header class="bar" id="brand"></header>

<main>
  <div class="intro">
    <h1>Dein Stressball.<br>Ganz nach dir.</h1>
    <p>Form, Schleim und Größe wählen – wir füllen ihn für dich.</p>
  </div>

  <div class="stage">
    <div class="ball" id="ball"></div>
    <div class="cap" id="cap"></div>
  </div>

  <div class="panel">
    <section>
      <h2>Form <small id="shapeName"></small></h2>
      <div class="opts shapes" id="shapes"></div>
    </section>

    <section>
      <h2>Schleim-Füllung <small id="fillName"></small></h2>
      <div class="opts colors" id="fills"></div>
    </section>

    <section>
      <h2>Größe</h2>
      <div class="seg" id="sizes"></div>
    </section>

    <section>
      <div class="field">
        <label for="qty">Anzahl</label>
        <div class="stepper">
          <button type="button" class="round" data-qty="-1" aria-label="Weniger">−</button>
          <input id="qty" name="qty" type="number" inputmode="numeric">
          <button type="button" class="round" data-qty="1" aria-label="Mehr">+</button>
        </div>
      </div>
    </section>

    <section>
      <h2>Deine Kontaktdaten</h2>
      <div class="field">
        <label for="name">Vollständiger Name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-describedby="e-name">
        <span class="err" id="e-name" data-err="name"></span>
      </div>
      <div class="field">
        <label for="phone">Telefonnummer</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="e-phone e-contact">
        <span class="err" id="e-phone" data-err="phone"></span>
      </div>
      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="e-email e-contact">
        <span class="err" id="e-email" data-err="email"></span>
        <span class="hint">Telefon oder E-Mail genügt.</span>
        <span class="err" id="e-contact" data-err="contact"></span>
      </div>
    </section>
  </div>
</main>

<div class="dock"><div>
  <p><strong id="sumTitle"></strong><span id="sum"></span></p>
  <button class="btn" id="order" type="button">Bestellen</button>
</div></div>

<dialog id="done">
  <div class="ball" id="doneBall"></div>
  <h2>Danke!</h2>
  <p>Wir melden uns bei dir, sobald dein Ball fertig ist.</p>
  <div id="doneSum"></div>
  <p class="note">Testversion – es wurde nichts gespeichert.</p>
  <form method="dialog"><button class="btn">Fertig</button></form>
</dialog>

<script src="../config.js"></script>
<script src="../shared.js"></script>
<script>
const o = newOrder();
const $ = id => document.getElementById(id);
$('brand').textContent = CONFIG.brand;
document.title = `${CONFIG.brand} – Stressball gestalten`;

function update() {
  const size = pick(CONFIG.sizes, o.size);
  drawBall($('ball'), o);
  $('shapes').style.color = pick(CONFIG.fillings, o.fill).hex;
  $('shapeName').textContent = o.shape;
  $('fillName').textContent = o.fill;
  $('cap').textContent = `${size.cm} cm Durchmesser`;
  $('sumTitle').textContent = `${o.shape} · Schleim ${o.fill}`;
  $('sum').textContent = `Größe ${size.name}${o.qty > 1 ? ' · ' + o.qty + ' Stück' : ''}`;
}

const big = CONFIG.sizes[CONFIG.sizes.length - 1].name;
renderOptions($('shapes'), 'shape', CONFIG.shapes, o,
  x => ballSvg({ ...o, shape: x.name, size: big }, true) + esc(x.name), update);
renderOptions($('fills'), 'fill', CONFIG.fillings, o, x => `<i style="background:${swatch(x)}"></i>`, update);
renderOptions($('sizes'), 'size', CONFIG.sizes, o, x => `${esc(x.name)}<small>${x.cm} cm</small>`, update);
const form = bindFields(document, o, update);
update();

$('order').onclick = async () => {
  if (!form.check()) return;
  await submitOrder(o);
  drawBall($('doneBall'), o);
  $('doneSum').innerHTML = summaryHtml(o);
  $('done').showModal();
};
</script>
</body>
</html>
